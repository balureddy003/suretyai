name: Feature Request
description: Suggest an idea for Surety AI
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to suggest a new feature!

        Before submitting, please check the [roadmap](https://github.com/balureddy003/suretyai/blob/main/ROADMAP.md) to see if this is already planned.

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: A clear and concise description of the problem or limitation.
      placeholder: I need to integrate Surety with LangGraph but there's no adapter...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you'd like
      description: A clear and concise description of what you want to happen.
      placeholder: Add a LangGraph adapter that wraps tool nodes with a Surety guard...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Describe alternatives you've considered
      description: Any alternative solutions or features you've considered.
      placeholder: I could manually wrap each tool call, but that's error-prone...
    validations:
      required: false

  - type: dropdown
    id: parity
    attributes:
      label: TypeScript / Python parity
      description: Does this feature need both TypeScript and Python implementations?
      options:
        - TypeScript only
        - Python only
        - Both (same feature)
        - Not sure
      validations:
        required: true

  - type: checkboxes
    id: terms
    attributes:
      label: Code of Conduct
      description: By submitting this issue, you agree to follow our [Code of Conduct](https://github.com/balureddy003/suretyai/blob/main/CODE_OF_CONDUCT.md)
      options:
        - label: I agree to follow this project's Code of Conduct
          required: true
