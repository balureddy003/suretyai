[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "suretyai"
version = "0.2.0"
description = "The open trust layer for autonomous AI agents — deterministic gates, budget breakers, and tamper-evident action receipts."
readme = "../README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
keywords = [
  "ai-agents", "guardrails", "agent-governance",
  "human-in-the-loop", "audit-trail", "action-receipt", "mcp", "trust"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries",
  "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/balureddy003/suretyai"
Repository = "https://github.com/balureddy003/suretyai"
Issues = "https://github.com/balureddy003/suretyai/issues"
Specification = "https://github.com/balureddy003/suretyai/blob/main/spec/action-receipt.md"

[tool.hatch.build.targets.wheel]
packages = ["suretyai"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
python_version = "3.10"
